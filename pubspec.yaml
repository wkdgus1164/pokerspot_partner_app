name: pokerspot_partner_app
description: 'A new Flutter project.'

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  card_swiper: ^3.0.1
  photo_view: ^0.15.0
  timeago: ^3.6.1
  pull_to_refresh: ^2.0.0
  fluttertoast: ^8.2.6

  # Common
  go_router: ^14.2.0
  logger: ^2.3.0
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  loader_overlay: ^4.0.0

  # Data
  hooks_riverpod: ^2.5.1
  flutter_hooks: ^0.20.5
  riverpod_annotation: ^2.3.5
  freezed_annotation: ^2.4.1
  retrofit: ^4.1.0
  dio: ^5.4.3+1
  json_annotation: ^4.9.0
  collection: ^1.18.0
  intl: ^0.19.0

  # Google
  firebase_core: ^3.1.1
  firebase_analytics: ^11.1.0
  firebase_crashlytics: ^4.0.2
  google_maps_flutter: ^2.2.8

  ## Loacl DB
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  flutter_localizations:
    sdk: flutter
  lottie: ^3.1.2
  flutter_inappwebview: ^6.1.5
  portone_flutter: ^0.12.0
  fl_chart: ^0.63.0
  image_picker: ^1.1.2
  numberpicker: ^2.1.2

dev_dependencies:
  flutter_lints: ^5.0.0
  change_app_package_name: ^1.2.0
  riverpod_generator: ^2.4.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.11
  custom_lint: ^0.7.0
  riverpod_lint: ^2.3.10
  retrofit_generator: ^9.1.5
  json_serializable: ^6.8.0
  freezed: ^2.5.2
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true

  assets:
    - assets/

flutter_launcher_icons:
  android: 'launcher_icon'
  ios: true
  image_path: 'assets/icon.png'
  min_sdk_android: 26
